<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T01 Generator v1.7 — Grindly Agency</title>
<link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --esp:#20191A;--por:#FEFEFE;--ivo:#E8DFD0;--cha:#C9A84C;--gry:#888888;
  --sp:'League Spartan',sans-serif;--pp:'Poppins',sans-serif;
  --ui:#1a1a1a;--pan:#252525;--bd:rgba(254,254,254,0.1);--mu:rgba(254,254,254,0.45);
}
html,body{height:100%;background:var(--ui);color:var(--por);font-family:var(--pp);font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:52px 1fr;height:100vh}

/* HEADER */
.hdr{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 20px;background:#111;border-bottom:0.5px solid var(--bd)}
.hdr-logo{height:20px;width:auto}
.hdr-title{font-family:var(--sp);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hdr-ver{font-size:10px;color:var(--mu);margin-left:4px}
.hdr-sep{width:0.5px;height:20px;background:var(--bd);margin:0 8px}

/* PANEL */
.pnl{background:var(--pan);border-right:0.5px solid var(--bd);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec{font-family:var(--sp);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}

/* Layout btns */
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lbtn{background:rgba(254,254,254,.06);border:0.5px solid var(--bd);border-radius:6px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);font-family:var(--sp);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .15s}
.lbtn:hover{background:rgba(254,254,254,.1);border-color:rgba(254,254,254,.25)}
.lbtn.on{background:rgba(254,254,254,.12);border-color:var(--por);color:var(--por)}
.lic{width:36px;height:44px;border-radius:2px;overflow:hidden;position:relative}
.li-a{background:#20191A}.li-a::before{content:'';position:absolute;top:30%;left:15%;right:15%;height:1.5px;background:#fefefe;opacity:.7}.li-a::after{content:'';position:absolute;top:45%;left:20%;right:20%;height:1px;background:#fefefe;opacity:.4}
.li-b{background:linear-gradient(180deg,#555,#333)}.li-b::before{content:'';position:absolute;top:5px;left:4px;right:4px;height:18px;background:rgba(254,254,254,.15);border-radius:1px}.li-b::after{content:'';position:absolute;bottom:6px;left:5px;right:5px;height:16px;background:#fefefe;border-radius:4px;opacity:.9}
.li-c{background:#20191A}.li-c::before{content:'';position:absolute;top:22%;left:10%;right:25%;height:9px;background:#fefefe;border-radius:6px;opacity:.75}.li-c::after{content:'';position:absolute;top:48%;left:25%;right:10%;height:9px;background:#E8DFD0;border-radius:6px;opacity:.75}
.li-d{background:linear-gradient(180deg,#555,#333)}.li-d::before{content:'';position:absolute;top:5px;left:4px;right:4px;height:6px;background:#fefefe;opacity:.9;border-radius:1px}
.li-e{background:#E8DFD0}.li-e::before{content:'';position:absolute;top:8px;left:5px;right:5px;height:5px;background:#20191A;opacity:.8;border-radius:1px}
.li-f{background:#20191A}
.li-g{background:#20191A}.li-g::after{content:'';position:absolute;top:35%;left:25%;right:25%;bottom:35%;background:#C9A84C;border-radius:50%;opacity:.6}

/* Fields */
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10px;font-weight:500;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld textarea{background:rgba(254,254,254,.06);border:0.5px solid var(--bd);border-radius:6px;color:var(--por);font-family:var(--pp);font-size:12px;padding:8px 10px;resize:none;width:100%;outline:none;transition:border-color .15s}
.fld input:focus,.fld textarea:focus{border-color:rgba(254,254,254,.3)}
.fld .hint{font-size:9px;color:var(--mu);opacity:.7}
.upz{border:0.5px dashed rgba(254,254,254,.25);border-radius:6px;padding:12px;text-align:center;cursor:pointer;background:rgba(254,254,254,.03);transition:all .15s}
.upz:hover{background:rgba(254,254,254,.06)}
.upz .ul{font-size:11px;color:var(--mu)}
.upz .us{font-size:9px;color:var(--mu);opacity:.6;margin-top:2px}
#fi{display:none}

/* Toggle */
.trow{display:flex;align-items:center;justify-content:space-between}
.tlbl{font-size:11px;color:var(--mu)}
.tog{width:32px;height:18px;background:rgba(254,254,254,.15);border-radius:9px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--por)}
.tog::after{content:'';position:absolute;width:12px;height:12px;background:var(--esp);border-radius:50%;top:3px;left:3px;transition:left .2s}
.tog.on::after{left:17px}

/* Mode Dark/Light */
.mtog{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mbtn{background:rgba(254,254,254,.06);border:0.5px solid var(--bd);border-radius:6px;padding:8px 0;cursor:pointer;font-family:var(--sp);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);text-align:center;transition:all .15s}
.mbtn:hover{background:rgba(254,254,254,.1)}
.mbtn.on{border-color:var(--por);color:var(--por);background:rgba(254,254,254,.12)}
.mbtn.md.on{background:#20191A;border-color:#FEFEFE;color:#FEFEFE}
.mbtn.ml.on{background:#E8DFD0;border-color:#20191A;color:#20191A}

.div{height:0.5px;background:var(--bd)}
.expbtn{width:100%;background:var(--por);color:var(--esp);border:none;border-radius:8px;padding:12px;font-family:var(--sp);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;margin-top:auto}
.expbtn:hover{opacity:.88}
.expbtn:disabled{opacity:.4;cursor:not-allowed}

/* Canvas */
.cva{display:flex;align-items:center;justify-content:center;background:#141414;overflow:hidden;position:relative}
#pvc{width:405px;height:506px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.7)}

/* Status fonts */
.fstatus{position:absolute;top:8px;right:8px;font-size:9px;font-family:var(--sp);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:rgba(0,0,0,.5)}
.fstatus.ok{color:#4caf7d}
.fstatus.loading{color:var(--mu)}
.fstatus.err{color:#e07a5f}

/* Render target */
#rt{position:fixed;left:-9999px;top:0;width:1080px;height:1350px;overflow:hidden;background:transparent}

/* === VISUAL STYLES === */
.vb{position:relative;width:1080px;height:1350px;overflow:hidden}
.txl{position:absolute;inset:0;pointer-events:none;z-index:1}
.phl{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
.ovl{position:absolute;inset:0;z-index:1}

/* LOGO — 69px, bottom 97px */
.lgz{position:absolute;bottom:97px;left:0;right:0;z-index:10;display:flex;justify-content:center}
.lgw{width:69px;height:auto;display:block}

/* Pastille & swipe */
.pill{position:absolute;bottom:100px;right:60px;z-index:11;width:44px;height:44px;border:2px solid #FEFEFE;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#FEFEFE}
.pill.dk{border-color:#20191A;color:#20191A}
.swp{position:absolute;bottom:104px;right:60px;font-family:'League Spartan',sans-serif;font-size:18px;font-weight:400;text-transform:uppercase;letter-spacing:.1em;color:#FEFEFE;z-index:11}
.swp.dk{color:#20191A}

/* LAYOUT A — centré vertical, padding bottom = 150px pour zone logo */
.la{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 80px 150px}
.la-q{font-family:'Poppins',sans-serif;font-weight:300;font-size:42px;line-height:1.6;max-width:880px}
.la-q em{font-weight:700;font-style:italic}

/* LAYOUT B */
.lb{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:60px 60px 150px}
.lb-card{border-radius:32px;padding:44px 50px;width:100%}
.lb-h1{font-family:'League Spartan',sans-serif;font-weight:800;font-size:68px;line-height:1.0;text-transform:uppercase;letter-spacing:-.01em}
.lb-h2{font-family:'League Spartan',sans-serif;font-weight:700;font-style:italic;font-size:44px;line-height:1.05;text-transform:uppercase;margin-top:4px}

/* LAYOUT C — FIX : structure en 3 zones fixes, pas de flex:1 */
.lc{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:60px 60px 0}
/* Zone titre : hauteur fixe */
.lc-top{flex-shrink:0;text-align:center;margin-bottom:50px}
.lc-h1{font-family:'League Spartan',sans-serif;font-weight:800;font-size:35px;text-transform:uppercase;line-height:1.0}
.lc-h2{font-family:'League Spartan',sans-serif;font-weight:400;font-style:italic;font-size:30px;text-transform:uppercase;line-height:1.0;margin-top:2px}
/* Zone bulles : occupe l'espace restant jusqu'à la zone logo */
.lc-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px;padding-bottom:180px}
.brow{display:flex;align-items:flex-end;gap:16px}
.brow.r{flex-direction:row-reverse}
.bav{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#555}
.bavg{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#20191A;border:1.5px solid #FEFEFE;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bavg img{width:28px;height:auto;display:block}
.bwrap{display:flex;flex-direction:column;gap:6px}
.blbl{font-family:'Poppins',sans-serif;font-size:17px;font-weight:300;font-style:italic;color:#888888}
.blbl.r{text-align:right}
/* Bulles : sans box-shadow, sans border-radius complexe pour html2canvas */
.bub{max-width:700px;padding:24px 30px;border-radius:24px;font-family:'Poppins',sans-serif;font-size:26px;font-weight:400;line-height:1.5}
/* Couleurs bulles gérées en inline style dans buildHTML selon le mode dark/light */
.bub.cl{}
.bub.gr{}

/* LAYOUT D */
.ld{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 60px 150px}
.ld-h1{font-family:'League Spartan',sans-serif;font-weight:900;font-size:148px;text-transform:uppercase;line-height:0.88;letter-spacing:-.02em;color:#FEFEFE}
.ld-h2{font-family:'League Spartan',sans-serif;font-weight:700;font-style:italic;font-size:96px;text-transform:uppercase;line-height:0.92;margin-top:8px;color:#FEFEFE}

/* LAYOUT E */
.le{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:70px 70px 150px;gap:30px}
.le-h1{font-family:'League Spartan',sans-serif;font-weight:800;font-size:64px;text-transform:uppercase;line-height:1.0}
.le-rule{width:120px;height:2px;opacity:.25}
.le-body{font-family:'Poppins',sans-serif;font-size:28px;font-weight:400;line-height:1.6}
.le-body em{font-weight:700;font-style:italic}

/* LAYOUT F */
.lf{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 1fr;padding:60px 60px 150px;gap:40px;align-items:center}
.lf-lbl{font-family:'League Spartan',sans-serif;font-weight:700;font-style:italic;font-size:38px;text-transform:uppercase;line-height:1.25}
.lf-arr{font-size:48px;opacity:.5;margin-top:16px}
.lf-stat{font-family:'League Spartan',sans-serif;font-weight:900;font-size:148px;line-height:0.88;text-align:center}
.lf-sub{font-family:'Poppins',sans-serif;font-size:28px;opacity:.7;text-align:center;margin-top:14px}

/* LAYOUT G */
.lg{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:60px 60px 150px}
.lg-top{flex-shrink:0;text-align:center}
.lg-h1{font-family:'League Spartan',sans-serif;font-weight:800;font-size:35px;text-transform:uppercase;line-height:1.0}
.lg-h2{font-family:'League Spartan',sans-serif;font-weight:400;font-style:italic;font-size:30px;text-transform:uppercase;line-height:1.0;margin-top:2px}
.lg-mid{flex:1;display:flex;align-items:center;justify-content:center}
.lg-ar{font-size:220px;color:#C9A84C;line-height:1;font-family:serif}

/* Carousel panel */
.car-sec{margin-top:8px}
.car-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.car-hdr .sec{margin-bottom:0}
.car-count{font-size:10px;color:var(--cha);font-family:var(--sp);letter-spacing:.06em}
.car-add{width:100%;background:rgba(254,254,254,.08);border:1px dashed rgba(254,254,254,.3);border-radius:8px;padding:10px;cursor:pointer;font-family:var(--sp);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cha);text-align:center;transition:all .15s}
.car-add:hover{background:rgba(254,254,254,.14);border-color:var(--cha)}
.car-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:320px;overflow-y:auto}
.car-item{display:flex;align-items:center;gap:8px;background:rgba(254,254,254,.05);border:0.5px solid var(--bd);border-radius:6px;padding:6px;position:relative}
.car-thumb{width:54px;height:67px;border-radius:3px;overflow:hidden;background:#333;flex-shrink:0}
.car-thumb img{width:100%;height:100%;object-fit:cover}
.car-info{flex:1;min-width:0}
.car-info .ci-num{font-family:var(--sp);font-size:11px;font-weight:700;color:var(--cha);letter-spacing:.06em}
.car-info .ci-lay{font-size:9px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-actions{display:flex;flex-direction:column;gap:3px}
.car-actions button{background:none;border:0.5px solid var(--bd);border-radius:4px;color:var(--mu);font-size:9px;padding:2px 5px;cursor:pointer;font-family:var(--sp);letter-spacing:.06em;transition:all .15s}
.car-actions button:hover{color:var(--por);border-color:rgba(254,254,254,.4)}
.car-actions button.car-del{color:#e07a5f}
.car-actions button.car-del:hover{color:#ff6b4f;border-color:#ff6b4f}
.car-export{width:100%;background:var(--cha);color:var(--esp);border:none;border-radius:8px;padding:10px;font-family:var(--sp);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;margin-top:8px}
.car-export:hover{opacity:.88}
.car-export:disabled{opacity:.4;cursor:not-allowed}
.car-empty{font-size:10px;color:var(--mu);text-align:center;padding:12px 0;opacity:.6;font-style:italic}

/* Loading */
.lov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px}
.lov.on{display:flex}
.lsp{width:32px;height:32px;border:2px solid rgba(254,254,254,.2);border-top-color:#fefefe;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ltxt{font-family:'League Spartan',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(254,254,254,.45)}
</style>
</head>
<body>

<div class="lov" id="lov">
  <div class="lsp"></div>
  <div class="ltxt" id="ltxt">Generating PNG...</div>
</div>

const CFG = {
  a:{ name:'Quote / Dark Texture', fields:[{id:'q',lbl:'Quote text',type:'ta',rows:4,hint:'*mot* = bold italic',ph:'Make them *crave* your brand.'}] },
  b:{ name:'Photo + Floating Card', photo:true, fields:[{id:'h1',lbl:'H1 ExtraBold',type:'tx',ph:'YOUR FOOD SPEAKS.'},{id:'h2',lbl:'H2 Bold Italic (optionnel)',type:'tx',ph:'Your feed should too.'}] },
  c:{ name:'iMessage / Dialogue', fields:[{id:'h1',lbl:'H1 titre',type:'tx',ph:'YOUR PROBLEMS'},{id:'h2',lbl:'H2 italic léger',type:'tx',ph:'OUR SOLUTIONS'},{id:'cm',lbl:'Message client (droite)',type:'ta',rows:2,ph:"My feed looks like everyone else's."},{id:'gm',lbl:'Réponse Grindly (gauche)',type:'ta',rows:2,ph:'We build content that only your brand can own.'}] },
  d:{ name:'H1 Massif / Photo', photo:true, fields:[{id:'h1',lbl:'H1 Massif (1 mot)',type:'tx',ph:'SERVING'},{id:'h2',lbl:'H2 Italic',type:'tx',ph:'UP STRATEGY'}] },

};

function sel(k) {
  S.layout=k; S.photo=null; S.photoC=null;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.toggle('on',b.dataset.l===k));
  buildFields(k); render();
}

const HOOKS_B = [
  {h1:'YOUR FOOD SPEAKS.',       h2:'Your feed should too.'},
  {h1:'POSTING ≠ STRATEGY.',     h2:'One is noise. The other is growth.'},
  {h1:'STOP POSTING DAILY.',     h2:'Start posting intentionally.'},
  {h1:'THE EXPERIENCE IS THERE.',h2:"The strategy isn't. Yet."},
  {h1:"GOOD FOOD ISN'T ENOUGH.", h2:"If no one sees it, it doesn't exist."}
];

function applyHookB(idx){
  const hk=HOOKS_B[idx];
  document.getElementById('fh1').value=hk.h1;
  document.getElementById('fh2').value=hk.h2;
  S.f.h1=hk.h1; S.f.h2=hk.h2;
  render();
}

function buildFields(k) {
  const cfg=CFG[k], el=document.getElementById('fc');
  S.f={};
  let h=`<div class="sec">${cfg.name}</div><div style="display:flex;flex-direction:column;gap:10px">`;
  if(k==='b'){
    h+=`<div class="fld"><label>Hook preset</label><select onchange="applyHookB(+this.value)" style="width:100%;padding:7px 10px;background:#2a2020;color:#E8DFD0;border:1px solid #444;border-radius:6px;font-size:12px;cursor:pointer;">`;
    HOOKS_B.forEach((hk,i)=>{ h+=`<option value="${i}">${hk.h1}</option>`; });
    h+=`</select></div>`;
  }
  if(k==='c'){
    h+=`<div class="fld"><label>Photo client (bulle droite)</label><div class="upz" onclick="document.getElementById('fic').click()"><div class="ul" id="ulc">Cliquer pour uploader</div><div class="us">JPG PNG WEBP — ronde dans la bulle</div></div><input type="file" id="fic" accept="image/*" onchange="loadPC(event)" style="display:none"></div>`;
  }
  if(cfg.photo) h+=`<div class="fld"><label>Photo de fond</label><div class="upz" onclick="document.getElementById('fi').click()"><div class="ul">Cliquer pour uploader</div><div class="us">JPG PNG WEBP — locale</div></div><input type="file" id="fi" accept="image/*" onchange="loadP(event)"></div>`;
  cfg.fields.forEach(f=>{
    S.f[f.id]=f.ph||'';
    const t=f.type==='ta'
      ?`<textarea id="f${f.id}" rows="${f.rows||3}" oninput="sf('${f.id}',this.value)">${f.ph||''}</textarea>`
      :`<input type="text" id="f${f.id}" value="${f.ph||''}" oninput="sf('${f.id}',this.value)">`;
    h+=`<div class="fld"><label>${f.lbl}</label>${t}${f.hint?`<span class="hint">${f.hint}</span>`:''}</div>`;
  });
  h+='</div>'; el.innerHTML=h;
}

function sf(k,v){S.f[k]=v;render();}
function loadP(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{S.photo=ev.target.result;const ul=document.querySelector('.ul');if(ul)ul.textContent=file.name;render();};
  r.readAsDataURL(file);
}

function loadPC(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{S.photoC=ev.target.result;const ul=document.getElementById('ulc');if(ul)ul.textContent=file.name;render();};
  r.readAsDataURL(file);
}

function setMode(m){
  S.mode=m;
  document.getElementById('bdk').classList.toggle('on',m==='dark');
  document.getElementById('blt').classList.toggle('on',m==='light');
  render();
}

function togg(k){
  S[k]=!S[k];
  if(k==='pill'&&S.pill) S.swipe=false;
  if(k==='swipe'&&S.swipe) S.pill=false;
  document.getElementById('tgr').classList.toggle('on',S.grain);
  document.getElementById('tpl').classList.toggle('on',S.pill);
  document.getElementById('tsw').classList.toggle('on',S.swipe);
  render();
}

function em(t){return (t||'').replace(/\*([^*]+)\*/g,'<em>$1</em>');}

// Texture SVG — ID fixe par type (pas de Date.now())
function tex(type){
  const id='ptex'+type;
  const s=type==='dark'?3:7;
  const op=type==='dark'?0.40:0.26;
  const bl=type==='dark'?'overlay':'multiply';
  const fi=type==='dark'?'#aaa':'#c5b89a';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" style="position:absolute;inset:0;opacity:${op};mix-blend-mode:${bl};pointer-events:none;z-index:1;display:block;"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="${s}" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1350" filter="url(#${id})" fill="${fi}"/></svg>`;
}

function C(){
  return S.mode==='dark'
    ?{bg:'#20191A',fg:'#FEFEFE',sub:'#E8DFD0',pc:'pill',sc:'swp',tx:'dark'}
    :{bg:'#E8DFD0',fg:'#20191A',sub:'#FEFEFE',pc:'pill dk',sc:'swp dk',tx:'ivory'};
}

function buildHTML(){
  const l=S.layout,f=S.f,p=S.photo,c=C();
  const gr=S.grain?`<div class="txl">${tex(c.tx)}</div>`:'';
  const logoSrc=S.mode==='dark'?LOGO_W:LOGO_D;
  const lo=`<div class="lgz"><img class="lgw" src="${logoSrc}" alt="Grindly Agency"></div>`;
  const pi=S.pill?`<div class="${c.pc}">→</div>`:'';
  const sw=S.swipe?`<div class="${c.sc}">SWIPE >>></div>`:'';

  if(l==='a') return `<div class="vb" style="background:${c.bg};">${gr}<div class="la"><p class="la-q" style="color:${c.fg};">${em(f.q)}</p></div>${lo}${pi}${sw}</div>`;

  if(l==='b'){
    const cbg=S.mode==='dark'?'#FEFEFE':'#20191A';
    const cfg=S.mode==='dark'?'#20191A':'#FEFEFE';
    const pbg=p?`background-image:url(${p});`:`background:${S.mode==='dark'?'#2a2020':'#E8DFD0'};`;
    const ov=S.mode==='dark'?'rgba(32,25,26,.4)':'rgba(232,223,208,.15)';
    return `<div class="vb" style="background:${c.bg};"><div class="phl" style="${pbg}"></div><div class="ovl" style="background:${ov};"></div>${gr}<div class="lb"><div class="lb-card" style="background:${cbg};"><div class="lb-h1" style="color:${cfg};">${(f.h1||'').toUpperCase()}</div>${f.h2?`<div class="lb-h2" style="color:${cfg};">${f.h2.toUpperCase()}</div>`:''}</div></div>${lo}${pi}${sw}</div>`;
  }

  if(l==='c'){
    const cavStyle=S.photoC
      ?`background-image:url(${S.photoC});background-size:cover;background-position:center;`
      :`background:#555;`;
    return `<div class="vb" style="background:${c.bg};">${gr}
    <div class="lc">
      <div class="lc-top">
        <div class="lc-h1" style="color:${c.fg};">${(f.h1||'YOUR PROBLEMS').toUpperCase()}</div>
        <div class="lc-h2" style="color:${c.fg};">${(f.h2||'OUR SOLUTIONS').toUpperCase()}</div>
      </div>
      <div class="lc-mid">
        <div class="brow r">
          <div class="bav" style="${cavStyle}"></div>
          <div class="bwrap" style="align-items:flex-end;">
            <div class="blbl r">you:</div>
            <div class="bub cl" style="background:${S.mode==='dark'?'#FEFEFE':'#20191A'};color:${S.mode==='dark'?'#20191A':'#FEFEFE'};">${f.cm||''}</div>
          </div>
        </div>
        <div class="brow">
          <div class="bavg"><img src="${logoSrc}" style="width:28px;height:auto;display:block;"></div>
          <div class="bwrap">
            <div class="blbl">Grindly:</div>
            <div class="bub gr" style="background:${S.mode==='dark'?'#E8DFD0':'#FEFEFE'};color:#20191A;">${f.gm||''}</div>
          </div>
        </div>
      </div>
    </div>
    ${lo}${pi}${sw}</div>`;
  }

  if(l==='d'){
    const pbg=p?`background-image:url(${p});`:(S.mode==='dark'?'background:linear-gradient(160deg,#4a4040,#1a1212);':'background:#E8DFD0;');
    const dovl=p?(S.mode==='dark'?'rgba(0,0,0,.25)':'rgba(232,223,208,.15)'):'rgba(0,0,0,0)';
    const dtc=S.mode==='dark'||p?'#FEFEFE':c.fg;
    return `<div class="vb" style="background:${p?'transparent':c.bg};"><div class="phl" style="${pbg}"></div><div class="ovl" style="background:${dovl};"></div>${gr}<div class="ld"><div class="ld-h1" style="color:${dtc};">${(f.h1||'SERVING').toUpperCase()}</div><div class="ld-h2" style="color:${dtc};">${(f.h2||'UP STRATEGY').toUpperCase()}</div></div>${lo}${pi}${sw}</div>`;
  }

  if(l==='e') return `<div class="vb" style="background:${c.bg};">${gr}<div class="le"><div class="le-h1" style="color:${c.fg};">${f.ti||''}</div><div class="le-rule" style="background:${c.fg};"></div><div class="le-body" style="color:${c.fg};">${em(f.bd)}</div></div>${lo}${pi}${sw}</div>`;

  if(l==='f') return `<div class="vb" style="background:${c.bg};">${gr}<div class="lf"><div style="display:flex;flex-direction:column;justify-content:center;"><div class="lf-lbl" style="color:${c.fg};">${f.lb||''}</div><div class="lf-arr" style="color:${c.fg};">→</div></div><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;"><div class="lf-stat" style="color:${c.fg};">${f.st||'70%'}</div>${f.sb?`<div class="lf-sub" style="color:${c.fg};">${f.sb}</div>`:''}</div></div>${lo}${pi}${sw}</div>`;

  if(l==='g') return `<div class="vb" style="background:${c.bg};">${gr}<div class="lg"><div class="lg-top"><div class="lg-h1" style="color:${c.fg};">${(f.h1||'RAMADAN MUBARAK').toUpperCase()}</div><div class="lg-h2" style="color:${c.fg};">${(f.h2||'SOCIAL MEDIA TIPS').toUpperCase()}</div></div><div class="lg-mid"><div class="lg-ar" style="color:${S.mode==='dark'?'#E8DFD0':'#20191A'};">${f.ar||'رمضان'}</div></div></div>${lo}${pi}${sw}</div>`;

  return '';
}

// Debounce render pour éviter les appels en rafale
let renderTimer=null;
function render(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(doRender,80);
}

async function doRender(){
  if(!fontsReady) return;
  const rt=document.getElementById('rt');
  rt.innerHTML=buildHTML();
  // Attendre que les images (logo) soient chargées
  const imgs=rt.querySelectorAll('img');
  await Promise.all(Array.from(imgs).map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r;})));
  try{
    const c=await html2canvas(rt,{
      width:1080,height:1350,scale:1,
      useCORS:true,allowTaint:true,
      backgroundColor:null,logging:false,
      imageTimeout:0,
      onclone:(doc)=>{
        // S'assurer que le clone hérite des fonts
        const link=doc.createElement('link');
        link.rel='stylesheet';
        link.href='https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap';
        doc.head.appendChild(link);
      }
    });
    const pv=document.getElementById('pvc');
    const ctx=pv.getContext('2d');
    ctx.clearRect(0,0,405,506);
    ctx.drawImage(c,0,0,405,506);
  }catch(e){console.error('render:',e);}
}

async function doExport(){
  const ov=document.getElementById('lov');
  const lt=document.getElementById('ltxt');
  const btn=document.getElementById('expbtn');
  ov.classList.add('on');btn.disabled=true;
  lt.textContent='Rendu haute résolution...';
  try{
    const rt=document.getElementById('rt');
    rt.innerHTML=buildHTML();
    const imgs=rt.querySelectorAll('img');
    await Promise.all(Array.from(imgs).map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r;})));
    await new Promise(r=>setTimeout(r,500));
    lt.textContent='Capture PNG 2160×2700...';
    const c=await html2canvas(rt,{
      width:1080,height:1350,scale:2,
      useCORS:true,allowTaint:true,
      backgroundColor:null,logging:false,imageTimeout:0,
      onclone:(doc)=>{
        const link=doc.createElement('link');
        link.rel='stylesheet';
        link.href='https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap';
        doc.head.appendChild(link);
      }
    });
    lt.textContent='Redimensionnement 1080×1350...';
    const out=document.createElement('canvas');
    out.width=1080;out.height=1350;
    out.getContext('2d').drawImage(c,0,0,1080,1350);
    const ml=S.mode==='dark'?'dark':'light';
    const gl=S.grain?'grain':'nograin';
    const a=document.createElement('a');
    a.download=`grindly-${S.layout}-${ml}-${gl}-${Date.now()}.png`;
    a.href=out.toDataURL('image/png');
    a.click();
  }catch(e){console.error(e);alert('Export error — voir console.');}
  finally{ov.classList.remove('on');btn.disabled=false;}
}

// === CAROUSEL BATCH MODE ===
const MAX_SLIDES = 10;
const carSlides = []; // each: { state: deep copy of S, html: string, thumb: dataURL }

async function addSlide() {
  if (carSlides.length >= MAX_SLIDES) {
    alert('Maximum ' + MAX_SLIDES + ' slides atteint.');
    return;
  }
  if (!fontsReady) return;

  // Capture current state
  const stateCopy = JSON.parse(JSON.stringify(S));
  const html = buildHTML();

  // Generate thumbnail
  const rt = document.getElementById('rt');
  rt.innerHTML = html;
  const imgs = rt.querySelectorAll('img');
  await Promise.all(Array.from(imgs).map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })));
  await new Promise(r => setTimeout(r, 200));

  let thumbData = '';
  try {
    const c = await html2canvas(rt, {
      width: 1080, height: 1350, scale: 0.05,
      useCORS: true, allowTaint: true,
      backgroundColor: null, logging: false, imageTimeout: 0,
      onclone: (doc) => {
        const link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap';
        doc.head.appendChild(link);
      }
    });
    thumbData = c.toDataURL('image/png');
  } catch (e) {
    console.error('Thumbnail generation error:', e);
  }

  // Determine label
  const ml = stateCopy.mode === 'dark' ? 'Dark' : 'Light';
  const gl = stateCopy.grain ? 'Grain' : 'No grain';
  const layoutName = CFG[stateCopy.layout] ? CFG[stateCopy.layout].name : stateCopy.layout.toUpperCase();
  const label = 'Layout ' + stateCopy.layout.toUpperCase() + ' — ' + ml + ' — ' + gl;

  carSlides.push({ state: stateCopy, html: html, thumb: thumbData, label: label });
  updateCarouselUI();
  render(); // restore preview
}

function removeSlide(idx) {
  if (idx >= 0 && idx < carSlides.length) {
    carSlides.splice(idx, 1);
    updateCarouselUI();
  }
}

function moveSlide(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= carSlides.length) return;
  const tmp = carSlides[idx];
  carSlides[idx] = carSlides[newIdx];
  carSlides[newIdx] = tmp;
  updateCarouselUI();
}

function updateCarouselUI() {
  const countEl = document.getElementById('carCount');
  const listEl = document.getElementById('carList');
  const emptyEl = document.getElementById('carEmpty');
  const exportBtn = document.getElementById('carExport');
  const addBtn = document.getElementById('carAdd');

  countEl.textContent = carSlides.length + ' / ' + MAX_SLIDES + ' slides';
  addBtn.disabled = carSlides.length >= MAX_SLIDES;

  if (carSlides.length === 0) {
    listEl.innerHTML = '<div class="car-empty">Aucune slide. Configurez un visuel puis cliquez +</div>';
    exportBtn.disabled = true;
    return;
  }

  exportBtn.disabled = false;
  let h = '';
  carSlides.forEach((slide, i) => {
    const num = String(i + 1).padStart(2, '0');
    h += '<div class="car-item">';
    h += '<div class="car-thumb">';
    if (slide.thumb) {
      h += '<img src="' + slide.thumb + '" alt="Slide ' + num + '">';
    }
    h += '</div>';
    h += '<div class="car-info">';
    h += '<div class="ci-num">Slide ' + num + '</div>';
    h += '<div class="ci-lay">' + slide.label + '</div>';
    h += '</div>';
    h += '<div class="car-actions">';
    if (i > 0) {
      h += '<button onclick="moveSlide(' + i + ',-1)" title="Monter">▲</button>';
    }
    if (i < carSlides.length - 1) {
      h += '<button onclick="moveSlide(' + i + ',1)" title="Descendre">▼</button>';
    }
    h += '<button class="car-del" onclick="removeSlide(' + i + ')" title="Supprimer">✕</button>';
    h += '</div>';
    h += '</div>';
  });
  listEl.innerHTML = h;
}

async function exportCarousel() {
  if (carSlides.length === 0) return;

  const ov = document.getElementById('lov');
  const lt = document.getElementById('ltxt');
  const btn = document.getElementById('carExport');
  ov.classList.add('on');
  btn.disabled = true;

  const rt = document.getElementById('rt');
  const total = carSlides.length;

  for (let i = 0; i < total; i++) {
    const slide = carSlides[i];
    const num = String(i + 1).padStart(2, '0');
    lt.textContent = 'Carousel ' + num + '/' + String(total).padStart(2, '0') + ' — Rendu...';

    try {
      rt.innerHTML = slide.html;
      const imgs = rt.querySelectorAll('img');
      await Promise.all(Array.from(imgs).map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })));
      await new Promise(r => setTimeout(r, 500));

      lt.textContent = 'Carousel ' + num + '/' + String(total).padStart(2, '0') + ' — Capture PNG...';
      const c = await html2canvas(rt, {
        width: 1080, height: 1350, scale: 2,
        useCORS: true, allowTaint: true,
        backgroundColor: null, logging: false, imageTimeout: 0,
        onclone: (doc) => {
          const link = doc.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap';
          doc.head.appendChild(link);
        }
      });

      lt.textContent = 'Carousel ' + num + '/' + String(total).padStart(2, '0') + ' — Redimensionnement...';
      const out = document.createElement('canvas');
      out.width = 1080;
      out.height = 1350;
      out.getContext('2d').drawImage(c, 0, 0, 1080, 1350);

      const a = document.createElement('a');
      a.download = 'grindly-carousel-' + num + '.png';
      a.href = out.toDataURL('image/png');
      a.click();

      // Small delay between downloads to avoid browser throttling
      if (i < total - 1) {
        await new Promise(r => setTimeout(r, 800));
      }
    } catch (e) {
      console.error('Export carousel slide ' + num + ' error:', e);
    }
  }

  ov.classList.remove('on');
  btn.disabled = false;
  render(); // restore preview
}

sel('a');
